spring:
  application:
    name: market-springboot
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flea_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 自定义配置
market:
  upload:
    # 文件上传路径
    path: ${user.dir}/uploads/
    # 访问路径前缀
    url-prefix: /uploads/
    # 头像上传路径
    avatar-path: ${market.upload.path}avatars/
    # 允许的图片格式
    allowed-image-types: jpg,jpeg,png,gif,bmp,webp

